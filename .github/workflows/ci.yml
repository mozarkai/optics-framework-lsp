name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `enable-cache: true`: v10's default is `auto`, which caches normally but
      # disables the cache on events where a poisoned entry could be planted. Forcing
      # `true` would opt back out of that.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # `--locked` fails if uv.lock is out of date with pyproject.toml, rather than
      # quietly resolving something the committed lockfile never described.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -q

      # Catching a broken sdist or wheel here
      - name: Build
        run: uv build

  vsix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install npm dependencies
        working-directory: editors/code
        run: npm ci

      - name: Build the bundled Python libs
        working-directory: editors/code
        run: make bundled/libs/.installed

      - name: Package the extension
        working-directory: editors/code
        run: npm run package

      # The extension host is a real VS Code window and needs a display. xvfb-run is
      # preinstalled on ubuntu-latest.
      - name: Run the extension test
        working-directory: editors/code
        run: xvfb-run -a npm test

      - name: Upload the VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: editors/code/*.vsix
          if-no-files-found: error
