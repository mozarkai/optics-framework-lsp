name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Held until the extensions are approved on their marketplaces. Uncomment to restore; nothing else in this workflow depends on it.
#       - name: Install Node
#         uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
#         with:
#           node-version: 24
#
#       - name: Install Java
#         uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
#         with:
#           distribution: temurin
#           java-version: 21

#       - name: Set up Gradle
#         uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Checks only pyproject while the extensions are held back: their versions are allowed to
      # drift from the tag until they are published again. Restore the three-way check with them.
      - name: Check the tag matches the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(uv version --short)
          echo "tag=$tag  pyproject=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag does not match pyproject=$declared"
            exit 1
          fi
#         extension=$(node -p "require('./editors/code/package.json').version")
#         plugin=$(sed -n 's/^pluginVersion=//p' editors/intellij/gradle.properties)

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Build
        run: uv build

      # Held until the extensions are approved on their marketplaces. Uncomment to restore; nothing else in this workflow depends on it.
#       - name: Install npm dependencies
#         working-directory: editors/code
#         run: npm ci
#
#       - name: Build the bundled Python libs
#         working-directory: editors/code
#         run: make bundled/libs/.installed
#
#       - name: Package the extension
#         working-directory: editors/code
#         run: npm run package
#
#       - name: Build and verify the plugin
#         working-directory: editors/intellij
#         run: ./gradlew --no-daemon check buildPlugin verifyPlugin

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

      # Held until the extensions are approved on their marketplaces. Uncomment to restore; nothing else in this workflow depends on it.
#       - name: Upload the VSIX
#         uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
#         with:
#           name: vsix
#           path: editors/code/*.vsix
#           if-no-files-found: error
#
#       - name: Upload the plugin
#         uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
#         with:
#           name: plugin
#           path: editors/intellij/build/distributions/*.zip
#           if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retrieve distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      # Held until the extensions are approved on their marketplaces. Uncomment to restore; nothing else in this workflow depends on it.
#       - name: Retrieve the VSIX
#         uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
#         with:
#           name: vsix
#           path: dist/
#
#       - name: Retrieve the plugin
#         uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
#         with:
#           name: plugin
#           path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=""
          case "$version" in
            *.*.*[!0-9]*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $flags

  pypi:
    runs-on: ubuntu-latest
    needs: [github-release]
    permissions:
      # Trusted publishing: PyPI checks this workflow's OIDC identity, so there is no token.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/optics-framework-lsp/
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      # Docker action: needs the COMMIT sha, not an annotated tag's object. No image exists
      # for the latter. Peel with `refs/tags/<tag>^{}`.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

