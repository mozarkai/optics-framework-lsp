# A yaml suite with one step nothing answers to. `Slep 5` is a misspelt `Sleep`: the keyword
# catalogue cannot claim any run of its words, so the reader takes the whole line as the
# keyword name. The `Sleep 5` above it is the same shape spelt right, and is clean.
Modules:
  - Yaml Module:
      - Sleep 5
      - Slep 5
