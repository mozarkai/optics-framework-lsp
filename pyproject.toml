[project]
name = "optics-framework-lsp"
version = "1.1.0"
description = "Language server and linter for optics-framework csv test suites"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Bishwa Bhusan Saha", email = "77796630+kun-codes@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["lsp", "language-server", "optics-framework", "linter", "test-automation", "csv"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]

dependencies = [
    "pygls>=2.1.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/mozarkai/optics-framework-lsp"
Repository = "https://github.com/mozarkai/optics-framework-lsp"
Issues = "https://github.com/mozarkai/optics-framework-lsp/issues"

[project.scripts]
optics-lsp = "optics_framework_lsp.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-lsp>=1.0.1",
]
